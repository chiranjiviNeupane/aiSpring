spring:
  application:
  name: aiSpring

  ai:
    google:
      genai:
        api-key: ${GCP_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite
        embedding:
          api-key: ${GCP_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768


    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

app:
  readonly:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: ${GCP_DB_USERNAME}
    password: ${GCP_DB_PASSWORD}